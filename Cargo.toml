[package]
name = "cdh"
version = "0.3.2"
edition = "2021"                     # 若你确实用了 2024 特性，可改为 "2024"
rust-version = "1.88"                # 最低编译版本（受 ratatui 0.30 约束；依赖解冻战役，2026-09-02 用户裁定 MSRV 1.74→1.88）
description = "A frecency-based smart directory jumper with a lightweight TUI."
readme = "README.md"
repository = "https://github.com/xianyudd/cdh"
homepage = "https://github.com/xianyudd/cdh"
license = "MIT"
keywords = ["cd", "frecency", "tui", "navigation"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
# toml 1.1（rust-version 1.85）：随 2026-09 依赖解冻战役落地——MSRV 已由 1.74 抬到
# 1.88（见上方 rust-version 注释），旧注释里「等 MSRV 抬到 1.76 再跨 0.9+」的门槛已越过。
toml = "1.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cdh"
path = "src/main.rs"

[profile.release]
opt-level = "z"        # 体积优先；若更关注性能可用 "s" 或 3
lto = "fat"            # 更激进的链接时优化（比 thin 更小更稳）
codegen-units = 1      # 提升优化机会
panic = "abort"        # 更小的二进制
strip = true           # 构建时去符号（需较新的 cargo）
