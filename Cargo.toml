[package]
name = "cdh"
version = "0.3.2"
edition = "2021"                     # 若你确实用了 2024 特性，可改为 "2024"
rust-version = "1.88"                # 最低编译版本（受 ratatui 0.30 约束；依赖解冻战役，2026-09-02 用户裁定 MSRV 1.74→1.88）
description = "A frecency-based smart directory jumper with a lightweight TUI."
readme = "README.md"
repository = "https://github.com/xianyudd/cdh"
homepage = "https://github.com/xianyudd/cdh"
license = "MIT"
keywords = ["cd", "frecency", "tui", "navigation"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
# 停在 0.8 线：toml >= 0.9.7 声明 rust-version 1.76、toml 1.x 要 1.76 / 1.85，都越过上面的
# MSRV 1.74。0.9.0–0.9.6 声明的是 1.66，其实塞得进 MSRV，但那只是六个 patch 版本宽的窗口，
# 而 0.9 之后的每个新 patch 都要 1.76，窗口不会再长——为这六个版本维护 ">=0.8, <0.9.7"
# 这种复合要求不划算。真要跨到 0.9 以上，等 MSRV 抬到 1.76 时连带一起动。
toml = "1.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cdh"
path = "src/main.rs"

[profile.release]
opt-level = "z"        # 体积优先；若更关注性能可用 "s" 或 3
lto = "fat"            # 更激进的链接时优化（比 thin 更小更稳）
codegen-units = 1      # 提升优化机会
panic = "abort"        # 更小的二进制
strip = true           # 构建时去符号（需较新的 cargo）
