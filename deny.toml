# cargo-deny 配置 —— 依赖审计策略
#
# cdh 通过 `curl | bash` 装进别人的 shell，供应链上的问题会直接落到用户机器上，
# 所以门槛按「发布物」而不是「内部工具」来定。
#
# 编写规则：**每条豁免都要写清三件事** —— 豁免的是什么、为什么可以接受、
# 什么条件下应该撤掉。只为了让 CI 变绿而加的 allow 等于把检查关掉，不算修复。
#
# 本地复现 CI 请**对齐版本**：ci.yml 用 `cargo-deny-action@v2.1.1`，它内置的是
# cargo-deny 0.20.2。版本要紧不是洁癖 —— 见下面 advisories 里 unsound 的注释，
# 0.19 改过默认值，用旧版本在本地验会得出比 CI 更强的结论。
#   cargo install cargo-deny --locked --version 0.20.2 && cargo deny --locked check
# 装了 0.19 以前的版本会直接报 `error[deprecated]` 指向本文件的 `unsound` 那一行
# （那个键名在 0.19 之前是别的含义，被移除过）—— 响亮地失败，不会静默给出不同结论。

[graph]
# 刻意留空 = 审计全部 target，包括我们并不发布的 windows。
#
# 看起来更「精确」的做法是把 release 矩阵的五个 target 列在这里，把 windows-only
# 的依赖从图里滤掉。不这么做的理由是漏检方向不对称：一旦 release.yml 新增 target
# 而忘了同步这里，cargo-deny 会安静地少查一个平台且仍然全绿——正是「条件为假 →
# 静默跳过 → 全绿」那类失败。留空则永远不会少查，代价只是多一条针对 windows 依赖
# 的重复版本豁免（见 bans.skip 的 windows-sys），很便宜。
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# advisories —— RustSec 通告
# ---------------------------------------------------------------------------
[advisories]
# 被 yank 的依赖直接失败，而不是只警告（默认是 warn）。
# 这会让 CI 受仓库外部状态影响，但 advisories 检查本来就有这个性质（新通告一样会
# 让无关 PR 变红），所以不引入新的不确定性类别；而「我们锁定的某个 crate 被作者
# 撤下了」对一个装进别人 shell 的工具来说确实算新闻。
yanked = "deny"

# 这两条是**显式写死默认值之外的选择**，不是照抄模板，删掉会静默削弱检查。
#
# unsound：cargo-deny 0.19.0（PR#826）新增了这个开关，默认 "workspace" ——
# 只对本 workspace 的 crate 报 unsound 通告，传递依赖的 unsound **一条都不报**。
# 本仓的 workspace 只有 cdh 自己，依赖全是传递的，所以默认值等于把 unsound
# 这一类彻底关掉。实测（ratatui 0.29 时代）：默认值下 CI 的 cargo-deny 输出
# `warning[advisory-not-detected] … no crate matched advisory criteria`，指的正是
# 当时的 lru 豁免 —— 通告没被检测到，豁免因此空转，而检查依然全绿。
# 那不是「没问题」，是「没检查」。写成 "all" 之后通告真的被检测到，
# 需要豁免的再由下面的 ignore 明确豁免掉，红/绿的含义才是我们审过的结论。
# （后来升到 ratatui 0.30，那批 lru 豁免随撤掉条件达成而删除，但这条开关
# 留着：它守的是「检查真的在跑」，不是某几条具体通告。）
unsound = "all"
# unmaintained：0.20 的默认值恰好也是 "all"，这里显式写出来是因为上面那条就是
# 「依赖默认值」踩的坑 —— 默认值会随版本变，而变化不会让 CI 变红，只会让它变松。
unmaintained = "all"

# ratatui 0.29 时代这里有三条 ignore（paste unmaintained、lru 两条 unsound），
# 升级到 ratatui 0.30 后撤掉条件全部达成（paste 已出树、lru 0.18.3 高于两条
# 通告的修复版本），2026-09 随 `chore: bump ratatui to 0.30` 一并删除，留此存照：
# 新增 ignore 必须写清「豁免的是什么、为什么可接受、什么条件下撤掉」。
ignore = []

# ---------------------------------------------------------------------------
# licenses —— 许可证
# ---------------------------------------------------------------------------
[licenses]
# 这份 allow 比 `cargo deny list` 的输出短，是刻意的：树里还出现 Unlicense
# （aho-corasick、memchr）、BSL-1.0（ryu）、Apache-2.0 WITH LLVM-exception
# （rustix、linux-raw-sys、wasi）三种，但它们都是 `X OR MIT` / `X OR Apache-2.0`
# 的一支，允许 MIT 与 Apache-2.0 已经把这些 crate 全部覆盖。多列一条就等于多批准
# 一类将来可能只以该许可证单独出现的依赖，所以不列。
allow = [
  "MIT",          # cdh 自身的许可证，依赖里 92 个 crate 用它（多为双授权的一支）
  "Apache-2.0",   # 67 个 crate 的另一支（多为 `MIT OR Apache-2.0` 双授权）
  "Unicode-3.0",  # unicode-ident 是 `(MIT OR Apache-2.0) AND Unicode-3.0`，
                  # AND 意味着这条是必需项而非可选项，不允许它这棵树根本装不上
  "Zlib",         # foldhash（← hashbrown ← indexmap / lru）的唯一许可证；宽松，
                  # 义务仅为保留声明
]
confidence-threshold = 0.8

# MPL-2.0 —— 整棵树里唯一的非宽松许可证。
# 豁免的是：nucleo-matcher 0.3.1（模糊匹配算法，cdh 的直接依赖），纯 MPL-2.0。
# 为什么可接受：MPL-2.0 是文件级弱 copyleft，义务只附着在 MPL 覆盖的那些文件上，
#   不会传染到 cdh 的 MIT 代码。我们不修改它，静态链接进二进制后的义务就是「让这些
#   文件的源码可获得」，crates.io 上的原始 crate 已经满足。
# 为什么写成 exceptions 而不是塞进 allow：放进 allow 会连带批准将来任何新的
#   MPL-2.0 依赖；scope 到这一个 crate，新出现的 MPL-2.0 会让检查变红并交人类判断。
# 撤掉条件：不再依赖 nucleo-matcher，或它改了许可证。
exceptions = [
  { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
]

[licenses.private]
ignore = false

# ---------------------------------------------------------------------------
# bans —— 重复版本与通配符依赖
# ---------------------------------------------------------------------------
[bans]
# 设成 deny 而不是默认的 warn：[profile.release] 是 opt-level = "z" +
# lto = "fat" + strip = true，体积是这个项目明确在优化的东西，而重复版本会整份进
# 二进制。93 个 crate 的树里新增一个重复值得人看一眼；warn 在 CI 上等于没有检查。
multiple-versions = "deny"
# 我们没有 `*` 版本依赖，这条是白拿的防线。
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

skip = [
  # hashbrown 同时存在 0.16.1 与 0.17.1（ratatui 0.30 引入）。
  # 豁免的是 0.16.1：来自 kasuari 0.4.12（约束求解器，ratatui-core 的布局后端，
  #   要求 kasuari ^0.4）。0.17.1 的用户是 ratatui-core / ratatui-widgets / lru。
  # 为什么可接受：不在我们手里——kasuari 0.4.12 已是 crates.io 最新（2026-03），
  #   仍钉 hashbrown ^0.16，收不收敛取决于上游发版。与 proc-macro 不同，这份
  #   会进二进制，代价是 kasuari 那一路的 hashbrown 查表/实现代码，量级可控。
  # 撤掉条件：kasuari 发依赖 hashbrown 0.17+ 的版本（届时这条会变成多余项，
  #   cargo-deny 不报多余 skip，升级 ratatui 树时要主动删掉再跑一遍确认）；
  #   或 ratatui-core 换布局后端。
  { crate = "hashbrown@0.16.1", reason = "kasuari 0.4.12（ratatui-core 布局后端）钉住的版本，上游未发 hashbrown 0.17 适配版。kasuari 升级后撤掉" },

  # syn 同时存在 2.0.118 与 3.0.4（ratatui 0.30 引入）。
  # 豁免的是 3.0.4：仅 thiserror-impl 2.0.20（← thiserror 2 ← kasuari /
  #   ratatui-core）在用；syn 2 那一路的用户是 darling / derive_more /
  #   strum_macros 等主流 proc-macro 生态。
  # 为什么可接受：syn 是 proc-macro 依赖，只存在于编译期，不进入发布二进制，
  #   对体积和供应链面都零影响；收不收敛取决于上游 proc-macro 生态整体迁到
  #   syn 3，不是本仓能推动的。
  # 撤掉条件：darling / derive_more / strum_macros 等迁到 syn 3 后树里只剩
  #   一个主版本（届时这条变多余，主动删掉再确认）；或 ratatui 树不再依赖
  #   thiserror 2。
  { crate = "syn@3.0.4", reason = "仅 thiserror-impl 2（kasuari→ratatui-core）使用 syn 3，其余 proc-macro 生态仍在 syn 2；proc-macro 不进二进制。上游生态收敛后撤掉" },
]
skip-tree = []

# ---------------------------------------------------------------------------
# sources —— 依赖来源
# ---------------------------------------------------------------------------
# 对 `curl | bash` 的工具，「依赖从哪来」比「依赖是什么许可证」更要紧。当前 93 个
# crate 全部来自 crates.io，所以这里一条豁免都没有：任何 git 依赖或私有 registry
# 溜进来都应该当场变红。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
