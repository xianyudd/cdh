name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # macOS 上的失败是本来就存在的 Mac 用户 bug，不该连带取消 Linux 的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v3

      # shell-lint 需要 fish 与 zsh 才能检查 installer payload；
      # CI 上工具缺失会硬失败（见 Justfile 的 shell-lint），所以这一步必须成功
      - name: Install shell tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shfmt fish zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shfmt fish

      - name: Run format and test checks
        run: |
          just fmt-check
          just shell-lint
          just test

      - name: Run strict clippy
        run: just lint-strict

  # MSRV 固化：Cargo.toml 声明 rust-version = "1.74"，但这个数字从没被构建检验过。
  # 跑完整 cargo test（不是只 build），因为这样才能同时守住 Cargo.lock 的格式：
  # lock version 4 需要 Cargo 1.78+，谁哪天 cargo update 升了 lock，这个 job 当场抓住。
  # 刻意不跑 clippy —— 旧版 lint 集不同，只会制造噪音。
  msrv:
    name: Build and test on MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.74

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Assert toolchain matches Cargo.toml rust-version
        run: |
          set -euo pipefail
          declared="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          actual="$(rustc --version | awk '{print $2}')"
          echo "Cargo.toml rust-version : ${declared}"
          echo "job toolchain rustc     : ${actual}"
          case "${actual}" in
            "${declared}" | "${declared}".*) ;;
            *)
              echo "::error::MSRV job 用的是 ${actual}，与 Cargo.toml 声明的 ${declared} 不一致"
              exit 1
              ;;
          esac

      - name: Run tests
        run: cargo test --locked --all

  # 依赖审计。单独一个 job 而不是塞进 check：
  # - 依赖图不随 runner 变化，跟着 os 矩阵跑两遍纯属浪费；
  # - 它是唯一会因**仓库外部状态**变红的检查（RustSec 出了新通告、某个 crate 被
  #   yank），混进 check 里会让「我们的代码坏了」和「外面出了事」两种红叉分不清。
  # 策略与每条豁免的理由写在仓库根的 deny.toml，本地复现：
  #   cargo install cargo-deny --locked && cargo deny --locked check
  deny:
    name: Audit dependencies (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 刻意钉到精确版本，而不是像本文件其他 action 那样用浮动大版本。
      # 理由：这个 action 消费我们自己写的 deny.toml，cargo-deny 改配置 schema 时
      # 浮动的 @v2 会让某个毫不相关的 PR 突然变红。钉住之后 schema 变化只会以
      # dependabot 的 github-actions PR 形式到来，红也只红它自己。
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          # --locked：不许 cargo-deny 顺手重写 Cargo.lock。本仓 lock 是
          # version = 3（MSRV 1.74 决定的），被升到 4 就会在 msrv job 上炸。
          # 这也替换掉 action 默认的 --all-features，让 deny.toml 里的
          # all-features 设置成为唯一事实来源（本 crate 没有 feature，等价）。
          arguments: --locked
