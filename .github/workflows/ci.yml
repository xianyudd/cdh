name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # macOS 上的失败是本来就存在的 Mac 用户 bug，不该连带取消 Linux 的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v4

      # shell-lint 需要 fish 与 zsh 才能检查 installer payload；
      # CI 上工具缺失会硬失败（见 Justfile 的 shell-lint），所以这一步必须成功
      - name: Install shell tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shfmt fish zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shfmt fish

      - name: Run format and test checks
        run: |
          just fmt-check
          just shell-lint
          just test

      - name: Run strict clippy
        run: just lint-strict

  # MSRV 固化：Cargo.toml 声明 rust-version = "1.74"，但这个数字从没被构建检验过。
  # 跑完整 cargo test（不是只 build），因为这样才能同时守住 Cargo.lock 的格式：
  # lock version 4 需要 Cargo 1.78+，谁哪天 cargo update 升了 lock，这个 job 当场抓住。
  # 刻意不跑 clippy —— 旧版 lint 集不同，只会制造噪音。
  msrv:
    name: Build and test on MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 版本走 toolchain 参数而不是 action 引用：引用里带版本号（@1.74）会被
      # Dependabot 当成过时的 action tag 反复开升级 PR（见 #22），而
      # MSRV 是 Cargo.toml rust-version 决定的固化语义（roadmap #5），不是
      # 「action 没更新」。版本一致性由下面的 assert 步骤守着。
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Assert toolchain matches Cargo.toml rust-version
        run: |
          set -euo pipefail
          declared="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          actual="$(rustc --version | awk '{print $2}')"
          echo "Cargo.toml rust-version : ${declared}"
          echo "job toolchain rustc     : ${actual}"
          case "${actual}" in
            "${declared}" | "${declared}".*) ;;
            *)
              echo "::error::MSRV job 用的是 ${actual}，与 Cargo.toml 声明的 ${declared} 不一致"
              exit 1
              ;;
          esac

      - name: Run tests
        run: cargo test --locked --all

  # 依赖审计。单独一个 job 而不是塞进 check：
  # - 依赖图不随 runner 变化，跟着 os 矩阵跑两遍纯属浪费；
  # - 它是唯一会因**仓库外部状态**变红的检查（RustSec 出了新通告、某个 crate 被
  #   yank），混进 check 里会让「我们的代码坏了」和「外面出了事」两种红叉分不清。
  # 策略与每条豁免的理由写在仓库根的 deny.toml，本地复现**要对齐版本**
  # （v2.1.1 内置 cargo-deny 0.20.2，旧版本对 advisories 的结论不同，见 deny.toml
  # 里 unsound 那段注释）：
  #   cargo install cargo-deny --locked --version 0.20.2 && cargo deny --locked check
  deny:
    name: Audit dependencies (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 刻意钉到精确版本，而不是像本文件其他 action 那样用浮动大版本。
      # 理由：这个 action 消费我们自己写的 deny.toml，cargo-deny 改配置 schema 时
      # 浮动的 @v2 会让某个毫不相关的 PR 突然变红。钉住之后 schema 变化只会以
      # dependabot 的 github-actions PR 形式到来，红也只红它自己。
      # 附带效果同样重要：action 的 tag 也就钉住了 cargo-deny 的版本（v2.1.1 =
      # 0.20.2），而 deny.toml 的结论对版本敏感 —— 0.19 改了 advisories.unsound
      # 的默认值。deny.toml 里记的 0.20.2 与这一行是一对，改一处要改两处。
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          # --locked：不许 cargo-deny 顺手重写 Cargo.lock。本仓 lock 是
          # version = 3（MSRV 1.74 决定的），被升到 4 就会在 msrv job 上炸。
          # 这也替换掉 action 默认的 --all-features，让 deny.toml 里的
          # all-features 设置成为唯一事实来源（本 crate 没有 feature，等价）。
          arguments: --locked

  # 交叉编译接线检查。release.yml 的矩阵有 aarch64-gnu 与 x86_64-musl 两行，
  # 但那个 workflow 只在推 tag 时跑——真要出问题（某个新依赖不支持 musl、
  # 某处 cfg 在 aarch64 上不成立），发现的时机就是发版当天，正是最糟的时刻。
  # 这个 job 把接线正确性提前到每个 PR，代价是几分钟 CI 时间。
  #
  # 用 debug 而不是 release：debug 没有 lto = "fat"，快得多，而链接器路径与
  # release 完全一样——这个 job 要抓的是「编译/链接不通」，不是产物形状。
  # 产物形状（架构对不对、musl 那份是不是真静态）在 release.yml 里单独断言。
  cross:
    name: Cross-build Linux targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (stable) with Linux cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # aarch64 需要一个能产出 aarch64 目标的链接器；x86_64-musl **不需要**
      # musl-tools —— 已在本地验证：把 musl-gcc / x86_64-linux-musl-gcc 换成
      # 必然失败的 stub 后 `cargo build --release --target x86_64-unknown-linux-musl`
      # 依然成功，rustc 用的是宿主 cc 加 rustup 自带的 self-contained musl 目标
      # 文件。本项目依赖树里没有 cc-rs / pkg-config，不编译任何 C 代码。
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # 真链接，不是 cargo check —— check 不跑链接器，会把「链接器没配对」这类
      # 错误一路放到发版当天。
      - name: Build for aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --target aarch64-unknown-linux-gnu

      - name: Build for x86_64-unknown-linux-musl
        run: cargo build --locked --target x86_64-unknown-linux-musl
