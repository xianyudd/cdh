name: release
# ---------------------------
# 自动化构建与发布流程：
# - 当推送 tag（vX.Y.Z）时触发
# - 可手动执行（workflow_dispatch）
# ---------------------------

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 允许此 Workflow 写入 Release
permissions:
  contents: write

jobs:
  # ==========================
  # 1. 测试阶段（Linux + macOS）
  # ==========================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # 构建矩阵里有两个 darwin target，测试必须覆盖到；
      # 一边红了也要看到另一边的结论
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # 发布前置检查：放在编译之前，否则要等三个平台编译完十几分钟，
      # 才在最后一步 body_path 上炸掉。
      # 只在 tag 触发时检查 —— workflow_dispatch 时 GITHUB_REF_NAME 是分支名，
      # 硬查必然误报。
      - name: Release preflight (tag only)
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "ref_type=${GITHUB_REF_TYPE:-unset}（不是 tag），跳过发布前置检查。"
            echo "release notes 与版本号一致性只对 v* tag 推送有意义。"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          notes="scripts/release_notes/${tag}.md"
          expected="${tag#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          status=0

          if [ -f "${notes}" ]; then
            echo "OK   release notes 存在：${notes}"
          else
            echo "::error::缺少 release notes：${notes}（softprops/action-gh-release 的 body_path 硬依赖它）"
            status=1
          fi

          if [ "${manifest}" = "${expected}" ]; then
            echo "OK   版本号与 tag 一致：Cargo.toml=${manifest} tag=${tag}"
          else
            echo "::error::版本号与 tag 不一致：Cargo.toml=${manifest}，tag=${tag}（应为 ${expected}）"
            status=1
          fi

          exit "${status}"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all

  # ==========================
  # 2. 构建与发布阶段
  # ==========================
  build-and-release:
    name: Build ${{ matrix.target }} and publish
    needs: [test]  # 等待测试完成后再执行
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # 原生 ARM runner（ubuntu-24.04-arm 已 GA，与 ubuntu-latest 同为
          # Ubuntu 24.04，只是 arm64），比过去的 cross 交叉编译省事。
          # 已知取舍：24.04 的 glibc 是 2.39，所以这份产物要求目标机 glibc ≥ 2.39
          # ——和 x86_64-gnu 那行的处境一致（它也在 ubuntu-latest 上构建）。
          # 树莓派 OS Bookworm 是 glibc 2.36，装不上这份。给旧 glibc 的 ARM 机器
          # 兜底需要 aarch64-unknown-linux-musl，那是本 PR 范围外的一行。
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # musl：静态链接，一份产物覆盖所有 glibc 版本的 x86_64 Linux。
          # 刻意不装 musl-tools —— 已验证不需要，见 ci.yml 里 cross job 的注释。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 安装 Rust
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 Cargo 构建目录
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 编译 release 版本
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 可执行文件瘦身（Linux）
      # 判据用 runner.os 而不是 matrix.os：矩阵里的 Linux runner 现在有两个
      # （ubuntu-latest 与 ubuntu-24.04-arm），写死 == 'ubuntu-latest' 会让 ARM
      # 那行的 if 为假 —— 而 if 为假不报错，结果是静默跳过瘦身却全绿。
      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip "target/${{ matrix.target }}/release/cdh" || true

      # 可执行文件瘦身（macOS）
      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip -x "target/${{ matrix.target }}/release/cdh" || true

      # 产物形状自检。跨编译矩阵最常见的错不是「编译不过」，而是「编译过了但产物
      # 不对」：架构串了、musl 那份其实动态链接了、或者根本没瘦身（上面两步都带
      # `|| true`，失败也不会报出来）。file 的输出一次能抓住这三种。
      #
      # 兜底的 `*)` 分支是这一步的要点：将来给矩阵加 target 却忘了在这里登记预期
      # 形状，它会**失败**而不是安静放过。
      #
      # 只覆盖 Linux：darwin 两行的 file 输出格式不同，而这里没有 macOS 机器可以
      # 先把预期字符串核准，写一个没验过的断言比不写更糟。
      - name: Verify artifact shape (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/cdh"
          desc="$(file -b "${bin}")"
          echo "file: ${desc}"

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              want_arch='x86-64'
              want_link='dynamically linked'
              ;;
            x86_64-unknown-linux-musl)
              want_arch='x86-64'
              want_link='static'
              ;;
            aarch64-unknown-linux-gnu)
              want_arch='ARM aarch64'
              want_link='dynamically linked'
              ;;
            *)
              echo "::error::矩阵新增了 target 却没在这里登记预期产物形状：${{ matrix.target }}"
              exit 1
              ;;
          esac

          status=0
          for want in "${want_arch}" "${want_link}"; do
            if [ "${desc#*"${want}"}" != "${desc}" ]; then
              echo "OK   产物包含 '${want}'"
            else
              echo "::error::产物形状不符：期望包含 '${want}'，实际是 ${desc}"
              status=1
            fi
          done

          # 瘦身单独判：file 对未瘦身的二进制输出的是 "not stripped"，直接用
          # "stripped" 做子串匹配会把它也算通过 —— 那种恒真断言等于没有断言。
          if [ "${desc#*not stripped}" != "${desc}" ]; then
            echo "::error::产物没有瘦身（Cargo.toml 的 [profile.release] strip 被去掉了？）"
            status=1
          else
            echo "OK   产物已瘦身"
          fi

          exit "${status}"

      # 打包构建产物
      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail
          APP_NAME=cdh
          VERSION=${GITHUB_REF_NAME}  # 形如 v0.1.1
          TARGET=${{ matrix.target }}
          OUT_DIR="dist/${APP_NAME}-${VERSION}-${TARGET}"

          mkdir -p "${OUT_DIR}"
          cp "target/${TARGET}/release/${APP_NAME}" "${OUT_DIR}/"
          cp -f LICENSE README.md scripts/install.sh "${OUT_DIR}/" || true
          mkdir -p "${OUT_DIR}/scripts"
          cp -R scripts/installers "${OUT_DIR}/scripts/"

          # 打包为 tar.gz
          tar -C dist -czf "${OUT_DIR}.tar.gz" "$(basename "${OUT_DIR}")"

          # 生成 sha256 校验文件
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "${OUT_DIR}").tar.gz" > "$(basename "${OUT_DIR}").tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$(basename "${OUT_DIR}").tar.gz" | awk '{print $1}' > "$(basename "${OUT_DIR}").tar.gz.sha256")
          fi

      # 上传到 CI Artifact（用于调试）
      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

      # 发布到 GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 上传所有 tar.gz 和校验文件
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256

          # 使用本地说明文件作为 release 描述
          body_path: scripts/release_notes/${{ github.ref_name }}.md

          # 不自动生成说明
          generate_release_notes: false

          # 覆盖旧文件（v2 引入的字段，v3 仍支持）
          overwrite_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
